notes:
  - The audit checked names, source lines, 1-based field numbers, draft ABI widths and mapping dispositions for each of the 25 subfiles.
  - The mapping template classifies every declaration as unsupported. No reviewed mappings or paired native snapshots were available. The strict mapping gate returns failure.
  - A synthetic f64 source-target pair exercises unit conversion and mismatch detection. Its scope is limited to the audit implementation.
  - Coordinator process termination after temporary write, before replacement and after replacement was injected with native OS processes on Windows and WSL.
  - Fresh readers verified the old or new manifest by bytes, 2-to-3 restart after retry, missing and truncated shards on two ranks and independent checkpoint/result consumers.
  - MSVC used /utf-8 for the C consumer and C++ library. Windows and WSL exercised the versioned C and Python visitors, immediate stop, exact UINT64_MAX and validity-mask delivery. The Windows install also passed a C99-only CMake find_package consumer and an installed Python import.
  - The C ABI reads legacy f64 entity histories and exact typed u64 entity histories. Each callback receives one sample. An exception or read failure preserves earlier callbacks.
  - The candidate only changes Track S paths. The released sdb-2.7.0 identity remains the consumer pin for JIG-3.
release_decision: production field equivalence and LTS qualification await reviewed mappings and paired captures
